[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iat-lab"
version = "0.2.0"
description = "IAT laboratory scene assets and reusable Blender tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iat-lab = "iat_lab.cli:main"

[tool.setuptools.packages.find]
include = ["iat_lab*"]

[tool.ruff]
line-length = 100
target-version = "py311"
